name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chata_ci
          POSTGRES_USER: chata_ci
          POSTGRES_PASSWORD: chata_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chata_ci -d chata_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://chata_ci:chata_ci@127.0.0.1:5432/chata_ci
      JWT_SECRET: ci-only-not-a-production-secret
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create the test schema
        run: npm run db:setup

      - name: Run static and schema checks
        run: npm run verify

      - name: Build production bundle
        run: npm run build

      - name: Start app and run read-only smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 8010 >"$RUNNER_TEMP/chata-next.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:8010/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo "The app did not become healthy within 90 seconds." >&2
            exit 1
          fi

          npm run smoke
